<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Halaman tidak ditemukan</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
  <style>
    body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FBF4EA;color:#141B2B}
    .nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px}
    .k{font-family:'Playfair Display',Georgia,serif;font-size:clamp(90px,18vw,160px);font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:2px #7684A8}
    h1{font-family:'Playfair Display',Georgia,serif;font-size:30px;margin:8px 0 0}
    p{color:#45464E;margin-top:10px;max-width:420px}
    a{margin-top:24px;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;background:#0C1B3A;color:#F5F1E8;font-weight:600;text-decoration:none}
    .ms{font-family:'Material Symbols Outlined';font-size:20px}
  </style>
</head>
<body>
  <div class="nf"><div class="k">404</div><h1>Halaman tidak ditemukan</h1><p>Halaman yang Anda cari tidak tersedia atau sudah dipindahkan.</p><a id="home" href="./"><span class="ms">home</span>Kembali ke Beranda</a></div>
  <script>
    // GitHub Pages proyek: arahkan ke folder repo (mis. /nama-repo/)
    var seg = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('github.io') && seg.length) document.getElementById('home').href = '/' + seg[0] + '/';
  </script>
</body>
</html>
